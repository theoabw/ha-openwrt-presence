name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Verify signed annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
              --jq '.object | select(.type == "tag") | .sha'
          )"
          test -n "$tag_object"
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
              --jq '.verification.verified'
          )" = true

      - name: Verify tag belongs to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Check
        run: scripts/check.sh

      - name: Verify and package release
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest_version="$(
            jq -r '.version' custom_components/openwrt_presence/manifest.json
          )"
          project_version="$(
            python3 -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "$version" = "$manifest_version"
          test "$version" = "$project_version"
          scripts/build-release.sh "$version" dist
          (
            cd dist
            sha256sum ./*.zip > SHA256SUMS
          )

      - name: Attest public release asset
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: dist/*.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/releases/$GITHUB_REF_NAME.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$notes_file" \
            --title "OpenWrt Presence $GITHUB_REF_NAME" \
            dist/*.zip dist/SHA256SUMS
